# The store H1/D05 migration matrices rebuild a database per hostile seam and
# take 60-190 s on a busy host (h1_trrev_v88 is ~120 s idle). A 240 s kill
# refused whole landing gates on load alone, so they get a bounded 600 s.
# Default-profile overrides also apply to every profile that inherits it.
[[profile.default.overrides]]
filter = 'package(rsid) & test(=session::context_cap::tests::pm_recovery_bootstrap_is_compact_and_does_not_immediately_rotate)'
# Retain all twelve recovery measurements as acceptance evidence on success.
success-output = "immediate"

[[profile.default.overrides]]
filter = 'package(rsid-store) & test(/^store::tests::(h1_|d05_)/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# #2453: two more slow-tier migration-history tests replay every shipped migration
# (`every_recovered_migration_step_actually_executes`) or rebuild a V76 issue-linkage
# database per fault seam (`d04_issue_linkage_copied_v76_...`). A scoped_test run
# with the hub thermal cap (a worker unit held at one core) ran 14 slow-tier tests
# at once and killed both at the 240 s mark while every other slow test passed, with
# no baseline red. Same bounded 600 s as the H1/D05 matrices, for the same reason
# (a kill on load alone refuses a whole gate).
[[profile.default.overrides]]
filter = 'package(rsid-store) & (test(=store::tests::every_recovered_migration_step_actually_executes) | test(=store::tests::d04_issue_linkage_copied_v76_upgrade_reopen_fault_rollback_and_fingerprint))'
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.rsid-fast]
inherits = "default"
retries = 0
fail-fast = false
# The merge-queue lander always passes `-j`, computed per gate as
# clamp((host threads - 1-minute load) / 2, 4, 16) (#2086) and recorded as
# `test_threads` in `gate_timing=`; this value only serves a hand-run profile.
test-threads = 8

# The rolling-library-qa run (`make rolling-library-qa`, #2092). It runs on the
# project satellite, a CPU-capped laptop that is also doing other work (#2172:
# load 9.6, five real-daemon tests red at once). Each of these tests starts a
# real `rsid` process and asserts a wall-clock bound on it (SIGINT exit within
# 3-10 s, health within 2 s of startup). A bound is only meaningful when the
# test has the CPU, so each runs alone (`num-test-threads` takes every -j slot,
# no other test runs beside it), and a breach must repeat once, alone, to be
# red: a regression breaches every time, load does not.
[profile.rsid-qa]
inherits = "rsid-fast"
# The full QA runs the slow tier (#2270).
default-filter = "all()"

[[profile.rsid-qa.overrides]]
filter = 'binary_id(=rsid::bin/rsid) & (test(=tests::idle_daemon_exits_cleanly_within_three_seconds_of_sigint) | test(=tests::open_client_does_not_prevent_bounded_sigint_shutdown) | test(=tests::live_provider_settles_restart_intent_within_ten_seconds_of_sigint) | test(=tests::stuck_blocking_task_does_not_hold_process_after_shutdown_complete) | test(=tests::startup_real_daemon_accepts_health_while_reclaim_is_held_for_two_seconds))'
threads-required = "num-test-threads"
retries = 1

[profile.ci-full]
inherits = "default"
retries = 0
fail-fast = false
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 6 }
# The full lane carries no filter: it runs the slow tier (#2270).
default-filter = "all()"

# Comparable per-test measurements for the daemon and store library suites.
[profile.test-timings]
inherits = "default"
# Keep completed-test durations visible even if an outer job budget expires.
status-level = "all"

[profile.test-timings.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = false
