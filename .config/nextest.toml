# The slow tier (#2270): the rsid-store tests that re-prove RELEASED, immutable
# migrations (.config/slow-tier.toml; about 47% of the summed rsid + rsid-store
# library test time when measured) are left out of every profile that inherits this
# one: rsid-fast (the merge-queue gate), test-timings and the default profile.
# They still run in `ci-full` and `rsid-qa` (the full QA, `make
# rolling-library-qa`), in `make test-slow-tier`, and in any gate or
# scoped_test whose diff touches a trigger path (scripts/check-touched-shards
# reports `slow_tier.mode`; the lander and scripts/scoped-test follow it).
# `--ignore-default-filter` runs the full suite from any profile. The line below
# is GENERATED, do not edit it by hand:
