# Slow tier of the rsid + rsid-store library suite (#2270).
#
# The tests named here re-prove RELEASED, immutable historical migrations:
# failpoint, rewind, replay and hostile-classifier matrices that rebuild a
# database per seam (store::tests h1_*, d04/d05, v95, v97, v112/v113, ...). Each
# took 2 s to 3 min in the 2026-10-13 `test-timings` run (rolling c61b71e19,
# nextest profile test-timings, 8-core slice) and together they were 47% of the
# summed rsid + rsid-store library test time. They matter when a migration or
# the migration runner changes; they do not need to run on every landing gate,
# every scoped_test and every QA sweep.
#
# How the tier works (docs/testing.md "Slow tier"):
#   * `.config/nextest.toml` `[profile.default] default-filter` EXCLUDES exactly
#     these tests, so every profile that inherits it (rsid-fast, test-timings,
#     the default profile) skips them. It is generated from `tests` below:
#         python3 scripts/check-touched-shards --write-slow-tier-filter
#     and the rsi-repo-guards test module `touched_shards::slow_checkout_tests` fails on drift.
#   * `ci-full` and `rsid-qa` set `default-filter = "all()"`, and the full QA
#     (`make rolling-library-qa`, scripts/run-rolling-qa.py) runs the slow tier.
#   * scripts/check-touched-shards decides mechanically, per candidate diff,
#     whether the slow tier runs (`slow_tier.mode` in its receipt, and
#     `--slow-tier-only` for the lander): `full` when the diff touches a
#     `trigger_paths` entry or a line of a slow test's own source, `excluded`
#     otherwise. scripts/scoped-test and rsi-rolling-land follow it.
#   * `make test-slow-tier` runs only this tier.
#
# Membership is an EXACT list, never a wildcard: a test is hidden from the
# default tier only because it is named here. Add a test by name when
# `make test-timings` shows a released-migration test over ~2 s; delete the name
# when the test is deleted (the Python guard fails on a name no source defines).
#
# Membership is decided by the test's SUBJECT (#2298): a test belongs here only if
# it rewinds, upgrades or replays a HISTORICAL schema (a rewound or copied database
# at an older version, a historical fixture, a migration failpoint). A version number
# or the word "replay" in the name is not enough: a test that opens the CURRENT
# schema and asserts current behaviour (a request replaying by idempotency key, a
# CAS winner, an event round-trip, a trigger or CHECK predicate, a column default)
# stays in the default tier, where a non-migration change to what it observes runs
# it. Judge a candidate by reading its body (and the fixture helper it opens), not
# its name.

package = "rsid-store"

# A candidate diff touching any of these runs the slow tier in full: a path
# ending in "/" is a directory prefix, any other entry is one file.
trigger_paths = [
    "crates/rsid-store/src/store/migrations/",
    "crates/rsid-store/build.rs",
    # The migration runner (`init_schema_internal`, MIGRATION_STEPS) and its
    # backup, allocation and convergence helpers.
    "crates/rsid-store/src/store/mod.rs",
    "crates/rsid-store/src/store/migration_allocation.rs",
    "crates/rsid-store/src/store/migration_backup.rs",
    "crates/rsid-store/src/store/catalog_convergence.rs",
    "crates/rsid-store/src/store/lineage_convergence.rs",
    "tools/released-migrations.json",
    # The tier's own definition.
    ".config/slow-tier.toml",
    ".config/nextest.toml",
]

