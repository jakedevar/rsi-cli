[package]
name = "rsi-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "RSI desktop UI: a Tauri shell whose Rust backend talks to rsid over its JSON-RPC socket"

# Standalone workspace: the Tauri/webkit dependency tree stays out of the root
# workspace build (same pattern as remote/contracts/v1/rust).
[workspace]

[lib]
name = "rsi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.13"
ammonia = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
