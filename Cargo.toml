[workspace]
resolver = "3"
members = [
    "crates/rsid",
    "crates/rsi",
    "crates/rsi-common",
    "crates/rsi-signal",
    "crates/rsi-graph",
    "crates/rsi-eval",
    "crates/rsi-diag",
    "crates/rsi-baseline",
    "crates/rsi-codegraph",
    "crates/flywheel-imessage",
    "crates/flywheel-signal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Jake DeVar"]
license = "AGPL-3.0-only"
repository = "https://github.com/jakedevar/rsi"

[workspace.dependencies]
# TUI Framework
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
tui-textarea = "0.7"

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Vim Bindings
modalkit = "0.0.24"
modalkit-ratatui = "0.0.24"
editor-types = "0.0.2"
keybindings = "0.0.2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

# Process utilities
which = "7"
nix = { version = "0.29", features = ["dir", "fs", "process", "signal"] }
rustix = { version = "1.1", features = ["process"] }
portable-pty = "0.8"
vt100 = "0.15"

# Error Handling
thiserror = "2"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Theming
catppuccin = { version = "2.6", features = ["ratatui"] }

# Syntax Highlighting
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "plist-load"] }
syntect-tui = "3.0"

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Tokenizer
tiktoken-rs = "0.5"

# Utilities
dirs = "5"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher = "0.3"
ignore = "0.4"
rand = "0.8"
regex = "1"
pipewire = "0.8"

# Tree-sitter syntax highlighting (file viewer)
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-language = "0.1"

# Grammar crates
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-md = "0.5"

# Template and config
serde_yaml_ng = "0.10"
minijinja = { version = "2", features = ["builtins"] }

# Clipboard
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

# Test-only env-var scoping (RSI-020)
temp-env = "0.3"

# Bench harness (Phase 0.3)
criterion = { version = "0.5", features = ["html_reports"] }

# RPC schema lock (Phase 2.2)
insta = { version = "1", features = ["json"] }

# CLI argument parsing (rsi-eval — RSI-006)
clap = { version = "4", features = ["derive"] }

# --- Hardening Foundation Phase 0.1 (warn-only baseline) -----------------
# All lints set to `warn`. Promotion to `deny` is deferred to Phase 2 per
# thoughts/shared/plans/2026-04-26-hardening-foundation-phase-0-and-1.md.
# Per-crate `[lints] workspace = true` opts each member in.

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
large_enum_variant = "warn"
mutable_key_type = "warn"
await_holding_lock = "warn"
missing_const_for_fn = "warn"
