# Project-declared durable verification recipes for AgentSubmitJob
# {"kind":"test","params":{"recipe":"<name>"}} (#1558). The runner is make
# (Makefile targets of the same name); the daemon wraps it in cargo-slot.
version = 1

# Frontend-only boot/key verification under a CPU quota; no desktop Cargo build.
[recipes.desktop-npm]
runner = "make"
target = "desktop-npm-test"
timeout_minutes = 20
cpu_quota_percent = 200

[recipes.desktop-vim-repeat]
runner = "make"
target = "desktop-vim-repeat"
timeout_minutes = 20
cpu_quota_percent = 200

# #591: bounded real-browser reproduction plus transport/lifetime regressions.
[recipes.desktop-browser-loss]
runner = "make"
target = "desktop-browser-loss"
timeout_minutes = 20
cpu_quota_percent = 200

# Opt-in watchdog challenge latency under one, then two rsid lib compiles.
[recipes.watchdog-pressure]
runner = "make"
target = "watchdog-pressure"
timeout_minutes = 20
cpu_quota_percent = 800

# Per-test durations for the rsid and rsid-store library suites (#2085): nextest
# profile test-timings prints every completed test's duration, even when the
# outer job budget expires first. A worker may submit it without
# timeout_minutes: the daemon defaults this recipe to 90 minutes (#2089); this
# declaration can only lower that.
[recipes.test-timings]
runner = "make"
target = "test-timings"
timeout_minutes = 90
# Match the eight nextest test threads for comparable before/after measurements.
cpu_quota_percent = 800

# Automatic coverage after a bounded rolling gate (#2092). One shared library
# build; fail-fast is disabled so a red does not hide the rest of either crate.
# agent_jobs derives the actual CPU quota from half the host threads, clamped
# to 2..12 cores (#2087), and supplies the same ceiling to nextest's -j.
[recipes.rolling-library-qa]
runner = "make"
target = "rolling-library-qa"
timeout_minutes = 180
cpu_quota_percent = 1200

# Scoped verification uses params.scoped_test, not a recipe (#1954).
# The daemon selects the rolling-tip tool and records the copy in its receipt.
# Resume a pinned child-worktree package from the manager's local completed-test
# inventory. Source/configuration stays outside the pinned QA tree; no rerun of
# completed passing library tests. See scripts/qa-resume --help.
[recipes.qa-resume-rsid]
runner = "make"
target = "qa-resume-rsid"
timeout_minutes = 90
cpu_quota_percent = 200

# Standard single pass: tmpfs test scratch where available, host scratch with
# parity reported unavailable otherwise. Builds retain the host TMPDIR (#1910).
[recipes.scoped-test]
runner = "make"
target = "scoped-test"
timeout_minutes = 20
cpu_quota_percent = 200

# #1584: the scoped-test recipes also take the request's focused `filters`
# (PACKAGE=FILTER, at most 16) as RSI_SCOPED_TEST_FILTERS; `make` passes them
# `--total-max-sec` below this cap so sequential package budgets fit inside it.

# Explicit parity-only compatibility recipe (#1577). The default scoped-test
# already uses tmpfs where available; do not submit this as a second pass.
# Reports `TMPFS_PARITY unavailable` and exits 0 where no tmpfs exists.
[recipes.scoped-test-tmpfs]
runner = "make"
target = "scoped-test-tmpfs"
timeout_minutes = 20
cpu_quota_percent = 200

# #2421: 20 consecutive runs of the editing-mode live-switch e2e test.
[recipes.e2e-editing-mode-live-switch-repeat]
runner = "make"
target = "e2e-editing-mode-live-switch-repeat"
timeout_minutes = 90
cpu_quota_percent = 800

# #3365: the fresh-install appoint-manager e2e test, one gated run (RSI_E2E=1).
[recipes.e2e-fresh-install-appoint-manager]
runner = "make"
target = "e2e-fresh-install-appoint-manager"
timeout_minutes = 60
cpu_quota_percent = 800

[recipes.check-touched-shards]
runner = "make"
target = "check-touched-shards"
timeout_minutes = 20
cpu_quota_percent = 200

# #3621: capture the scoped_test receipt conformance corpus from the receipts the
# Python runner printed in real jobs (hub job table, read-only); builds one small crate.
[recipes.scoped-receipt-corpus]
runner = "make"
target = "scoped-receipt-corpus"
timeout_minutes = 20
cpu_quota_percent = 200

# Pool builds can be measured through the durable job's systemd CPU accounting.
[recipes.target-pool-build]
runner = "make"
