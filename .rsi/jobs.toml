target = "check-socket-activation-macos"
timeout_minutes = 20
cpu_quota_percent = 200

# Regenerate and check the operator manual after settings/keybinding changes.
[recipes.manual]
runner = "make"
target = "manual"
timeout_minutes = 20
cpu_quota_percent = 200

# #3239: build the desktop app (desktop/src-tauri is a standalone workspace no
# `build` job can name) and run scripts/install-desktop.sh --required into a job-owned
# throwaway HOME/XDG tree (scripts/desktop-install-job.sh). A cold release build is
# 600 crates, 20+ minutes on the 4-core hub, so the budget is long.
[recipes.desktop-install]
runner = "make"
target = "desktop-install-job"
timeout_minutes = 90
cpu_quota_percent = 400

# #3279 (#3000 criterion 4): run the desktop `graph-run` E2E scenario against an isolated real
# rsid built with its matching rsi-e2e-seed binary, and write graph-run-receipt.json (source SHA,
# daemon sha256, command, exit code, graph-seeded-daemon/render/readback statuses). The job exits
# non-zero unless all three passed, so a skipped or absent run can never read as green. It needs
# Chrome on the host (else runner_unavailable, exit non-zero). A debug cargo build plus npm ci.
[recipes.desktop-e2e-graph]
runner = "make"
target = "desktop-e2e-graph-job"
timeout_minutes = 60
cpu_quota_percent = 400
