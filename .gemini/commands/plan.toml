## Phase 1: [Descriptive Name]

### Overview
[What this phase accomplishes]

satisfies: [F-001, F-014]  <!-- research Finding.id(s) this phase closes; RESEARCH_SCHEMA_VERSION >= 2. Omit only for pure scaffolding with no research antecedent, and say so explicitly. -->

### Changes Required:

#### 1. [Component/File Group]
**File**: `path/to/file.ext`
**Changes**: [Summary of changes]

```[language]
// Specific code to add/modify
```

### Success Criteria:

<!-- [inferred] is forbidden here. Every criterion must be supported by cited [observed] or [source] evidence. -->

#### Automated Verification:
