````

### Step 5: Sync and Review

1. **Present the draft plan location**:
   ```
   I've created the initial implementation plan at:
   `thoughts/shared/plans/YYYY-MM-DD-ENG-XXXX-description.md`

   Please review it and let me know:
   - Are the phases properly scoped?
   - Are the success criteria specific enough?
   - Any technical details that need adjustment?
   - Missing edge cases or considerations?
   ```

2. **Iterate based on feedback** - be ready to:
   - Add missing phases
   - Adjust technical approach
   - Clarify success criteria (both automated and manual)
   - Add/remove scope items
   - After making changes, ensure the updated plan is saved and committed in git so the `thoughts/` directory stays in sync across worktrees

3. **Continue refining** until the user is satisfied

## Important Guidelines

1. **Be Skeptical**:
   - Question vague requirements
   - Identify potential issues early
   - Ask "why" and "what about"
   - Don't assume - verify with code

   - **Check the plan against itself before writing it out.** Every constraint
     must be compatible with every design decision. If a constraint says
     "preserve X" and a decision replaces or removes X, that is a contradiction
     to resolve now, not to hand to the implementer. State the resolution
     explicitly in the plan.
   - **Never specify that user-visible information becomes absent.** If a
     design decision removes a name, title, label, or identifier from the
     screen, say where the user reaches it instead. A plan that silently drops
     an entity's identity produces an unfindable entity.

2. **Be Autonomous**:
   - Write the full plan in one shot without pausing for confirmation
   - Make design decisions based on codebase research and the Five-Expert Framework
   - Document your reasoning so the user can review and iterate after the fact
   - The user will use `/iterate_plan` if they want changes

3. **Be Thorough**:
   - Honor the read budget before planning (see worker preamble §2).
   - Research actual code patterns using parallel sub-tasks
   - Include specific file paths and line numbers
   - Write measurable success criteria with clear automated vs manual distinction
   - Prefer workspace-aware cargo scripts when possible (e.g., `cargo test -p rsi` instead of manually `cd`-ing into subdirectories)

4. **Be Practical**:
   - Focus on incremental, testable changes
   - Consider migration and rollback
   - Think about edge cases
   - Include "what we're NOT doing"

5. **Track Progress**:
   - Use TodoWrite to track planning tasks
   - Update todos as you complete research
   - Mark planning tasks complete when done

6. **No Open Questions in Final Plan**:
   - If you encounter open questions during planning, STOP
   - Research or ask for clarification immediately
   - Do NOT write the plan with unresolved questions
   - The implementation plan must be complete and actionable
   - Every decision must be made before finalizing the plan

## Success Criteria Guidelines

`[inferred]` is forbidden in Acceptance Criteria and Success Criteria. A plan
with any load-bearing `[inferred]` claim must execute and reclassify the claim
or downgrade readiness; it cannot be labeled `decision-complete` or
`implementation-ready`, described as `ready for implementation`, or given any
equivalent readiness promise. Cite the primary artifact/result for `[observed]`
criteria and the authoritative requirement for `[source]` criteria; a command
name alone is not evidence.

**Always separate success criteria into two categories:**

1. **Automated Verification** (can be run by execution agents):
   - Commands that can be run: `make test`, `npm run lint`, etc.
   - Specific files that should exist
   - Code compilation/type checking
   - Automated test suites

2. **Manual Verification** (requires human testing):
   - UI/UX functionality
   - Performance under real conditions
   - Edge cases that are hard to automate
   - User acceptance criteria

**Format example:**
```markdown
### Success Criteria:

<!-- [inferred] is forbidden here. Every criterion must be supported by cited [observed] or [source] evidence. -->

#### Automated Verification:
- [ ] [source] Database migration runs successfully: `make migrate` — [requirement citation]
- [ ] [source] All unit tests pass: `go test ./...` — [requirement citation]
- [ ] [observed] Lint command is available: `golangci-lint run` — [tool result]
- [ ] [source] API endpoint returns 200: `curl localhost:8080/api/new-endpoint` — [requirement citation]

#### Manual Verification:
- [ ] [source] New feature appears correctly in the UI — [requirement citation]
- [ ] [source] Performance is acceptable with 1000+ items — [requirement citation]
- [ ] [source] Error messages are user-friendly — [requirement citation]
- [ ] [source] Feature works correctly on mobile devices — [requirement citation]
```

## Common Patterns

### For Database Changes:
- Start with schema/migration
- Add store methods
- Update business logic
- Expose via API
- Update clients

### For New Features:
- Research existing patterns first
- Start with data model
- Build backend logic
- Add API endpoints
- Implement UI last

### For Refactoring:
- Document current behavior
- Plan incremental changes
- Maintain backwards compatibility
- Include migration strategy

## Sub-task Spawning Best Practices

When spawning research sub-tasks:

1. **Spawn multiple tasks in parallel** for efficiency
2. **Each task should be focused** on a specific area
3. **Provide detailed instructions** including:
   - Exactly what to search for
   - Which directories to focus on
   - What information to extract
   - Expected output format
4. **Be EXTREMELY specific about directories**:
   - Reference concrete crates when noting directories (e.g., `crates/rsi/` for the TUI, `crates/rsid/` for the daemon)
   - If it mentions "daemon", specify `hld/` directory
   - Never use generic terms like "UI" when you mean "WUI"
   - Include the full path context in your prompts
5. **Specify read-only tools** to use
6. **Request specific file:line references** in responses
7. **Wait for all tasks to complete** before synthesizing
8. **Verify sub-task results**:
   - If a sub-task returns unexpected results, spawn follow-up tasks
   - Cross-check findings against the actual codebase
   - Don't accept results that seem incorrect

Example of spawning multiple tasks:
```python
# Spawn these tasks concurrently:
tasks = [
    Task("Research database schema", db_research_prompt),
    Task("Find API patterns", api_research_prompt),
    Task("Investigate UI components", ui_research_prompt),
    Task("Check test patterns", test_research_prompt)
]
```

## Example Interaction Flow

```
User: /plan thoughts/allison/tickets/eng_1478.md
Assistant: [Reads ticket file fully]
[Spawns parallel research agents]
[Makes design decisions autonomously based on Five-Expert Framework]
[Writes complete plan to thoughts/shared/plans/]
[Commits and pushes]

I've created the implementation plan at:
`thoughts/shared/plans/2025-01-08-ENG-1478-parent-child-tracking.md`

[Summary of plan contents and key design decisions made]

Use `/iterate_plan` if you want to adjust anything.
```

## Commit and Push — MANDATORY

Before responding, commit the plan document and other task-owned files using explicit paths. Never stage the entire `thoughts/` directory or unrelated edits. Leave the tree clean. Push only if the user explicitly asked; then push the current feature branch as a safe fast-forward, never `main`.

## Final Response Format

When you complete the plan and are ready to respond to the user, ensure you have written the plan file to `thoughts/shared/plans/` — the daemon detects this Write and automatically derives the next pipeline step (`/implement`).
'''
