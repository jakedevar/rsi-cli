description = "Create detailed implementation plans autonomously through thorough research"
prompt = '''---
description: Create detailed implementation plans autonomously through thorough research
model: opus
capability_class: architect
---

# Implementation Plan

You are tasked with creating detailed implementation plans through an interactive, iterative process. You should be skeptical, thorough, and work collaboratively with the user to produce high-quality technical specifications.

**Worker preamble (binding):** This command and any sub-agents it spawns MUST load and obey `/home/jakedevar/rsi/.claude/commands/_shared/worker_preamble.md` with `role=planning` before acting. That file defines the read budget, return budget, forbidden-content rules, and failure-mode contract. The rules below COMPOSE ON TOP and may tighten (never loosen) any limit declared there.

## Five-Expert Decision Framework

This application is built for a single user (IQ 150, ADHD, vim devotee). Quality over speed of implementation. Every planning decision must pass through all five expert lenses:

1. **SWE** (Clean architecture): Will this plan create duplicate code? Are the abstractions at the right boundaries? Single responsibility maintained across modules?
2. **Tech Wizard** (Zero-waste correctness): Does this ordering avoid throwaway code? Are we building on the correct foundation first? **HAS VETO POWER over implementation ordering.** If the foundation is wrong, the Tech Wizard blocks until it's fixed — no bolting features onto a layer that will be rewritten.
3. **UI/UX Power User** (Information density): Is the planned UI dense enough for a power user who reads fast and thinks fast? Every action reachable by keyboard in 1-2 keystrokes? No hand-holding, no confirmation dialogs, no progressive simplification?
4. **Cognitive Flow Engineer** (ADHD-aware design): Does this plan protect flow state? Are there latency risks (polling intervals, spinners, forced modals)? Will any transition create a test coverage gap that forces debugging by feel? **Write new tests BEFORE deleting old ones.** Never leave the user without a regression safety net.
5. **Vim Language Designer** (Compositional grammar): Is the action grammar designed BEFORE implementation? Do keybindings compose with vim's verb-noun model (`d` + `is` = kill inner session)? Custom operators that wait for motions, not flat key overloads? **HAS VETO POWER over keybinding design.** The grammar must be coherent before code is written.

**If any expert objects, resolve the conflict before finalizing the plan.** Present the conflict and resolution in the plan document.

Canonical reference with full expert descriptions: `five-experts.md`

## Initial Response

When this command is invoked:

1. **Check if parameters were provided**:
   - If a file path or ticket reference was provided as a parameter, skip the default message
   - Immediately read any provided files (honor the shared preamble's read budget — see `_shared/worker_preamble.md` §Read budget)
   - **Check for a matching worktree** (see Step 0 below)
   - Begin the research process

2. **If no parameters provided**, respond with:
```
I'll help you create a detailed implementation plan. Let me start by understanding what we're building.

Please provide:
1. The task/ticket description (or reference to a ticket file)
2. Any relevant context, constraints, or specific requirements
3. Links to related research or previous implementations

I'll analyze this information and work with you to create a comprehensive plan.

Tip: You can also invoke this command with a ticket file directly: `/plan thoughts/allison/tickets/eng_1234.md`
For deeper analysis, try: `/plan think deeply about thoughts/allison/tickets/eng_1234.md`
```

Then wait for the user's input.

## Scope Routing — MANDATORY

After reading the ticket/research inputs (Step 1 below) and before spawning the parallel research sub-agents (Step 2), assess scope. If ANY of the following are true, automatically route to `/team_plan`:

- Plan will likely have >3 phases
- Touches >2 crates (e.g., TUI + daemon + common)
- Mixes >2 of {schema migration, RPC surface, UI, persistence, daemon process management}
- Estimated >30 min of focused planning work

Announce the routing decision once:
```
Scope is team-sized (reason: <1 sentence>); routing to `/team_plan`.
```

Continue immediately in the current invocation using the Team Create Plan
workflow in `team_plan.md`. Do not ask for confirmation and do not require the
user to re-invoke another command. If the active harness cannot dispatch team
workers, apply the same domain decomposition and synthesis discipline in the
current session and note the degraded execution mode; do not turn missing team
tooling into a user gate. An explicit user instruction to keep the work solo
overrides this automatic route.

## Process Steps

### Step 0: Worktree Detection & Checkout

When a file path parameter is provided, check if a git worktree exists that matches the filename stem (without extension):

1. **Extract the name from the file path**:
   - Given a path like `thoughts/shared/plans/2026-02-10-archived-session-browser.md`
   - Extract the stem: `2026-02-10-archived-session-browser`

2. **Check for a matching worktree**:
   - Run `git worktree list` and look for a worktree whose path or branch name contains the extracted stem
   - Match against worktree paths in these known locations:
     - `.worktrees/<stem>/`
     - `~/rsi-<stem>/`
     - `~/wt/<stem>/`
     - `~/<stem>/`
   - Also match against the branch name in the worktree list output

3. **If a matching worktree is found**:
   - Print: `Found matching worktree: <worktree_path> (branch: <branch_name>)`
   - `cd` into the worktree directory so all subsequent work happens there
   - The plan file should still be accessible via its relative path (e.g., `thoughts/shared/plans/...`) since thoughts are synced between main repo and worktrees
   - Continue with the rest of the planning process from within the worktree

4. **If no matching worktree is found**:
   - Continue normally in the current directory
   - No message needed — proceed silently

### Step 1: Context Gathering & Initial Analysis

1. **Read all mentioned files immediately**:
   - Ticket files (e.g., `thoughts/allison/tickets/eng_1234.md`)
   - Research documents
   - Related implementation plans
   - Any JSON/data files mentioned
   - **IMPORTANT**: Honor the read budget (see worker preamble §2).
   - **CRITICAL**: DO NOT spawn sub-tasks before reading the relevant portions of these files yourself in the main context

1a. **JSON sidecar probe (RSI-014):** For each research document path mentioned in the inputs, prefer the typed JSON sidecar over markdown grep:
   1. Compute `<doc>.json = <doc>.md` with `.md` replaced by `.json`.
   2. If `<doc>.json` does NOT exist, OR the markdown frontmatter contains `json_companion_status: invalid` → skip the validator and proceed via the markdown read above. No warning.
   3. Otherwise, ensure `target/debug/rsi-research-validate` exists (run `cargo build -p rsi-common --bin rsi-research-validate --quiet` if missing), then run `target/debug/rsi-research-validate <doc>.json`.
   4. On exit `0`: read and parse the JSON. Use it deterministically:
      - `findings[]` → seed your in-memory plan-research working set with these typed summaries. **Retain each `findings[].id`** (`F-001`, …): every plan phase/item that traces to a finding declares it under `satisfies:` (see the phase template and §Cross-stage linkage below).
      - `areas[]` → seed your domain decomposition.
      - `open_questions[]` where `blocks_planning: true` → resolve before finalizing the plan; do NOT punt them.
      - `file_refs[]` → preferred file:line targets for sub-agent dispatch.
   5. On exit `2` or `1`: log one line on stderr `JSON sidecar invalid: <reason>; falling back to markdown` and continue with the markdown path. The fallback is silent for the user — only the trace records it.
   This step is read-only — no files written, no commits, no daemon-visible side effects.

2. **Spawn initial research tasks to gather context**:
   Before asking the user any questions, use specialized agents to research in parallel:

   - Use the **codebase-locator** agent to find all files related to the ticket/task
   - Use the **codebase-analyzer** agent to understand how the current implementation works
   - If relevant, use the **thoughts-locator** agent to find any existing thoughts documents about this feature
   - If a Linear ticket is mentioned, use the **linear-ticket-reader** agent to get full details

   These agents will:
   - Find relevant source files, configs, and tests
   - Identify the specific directories to focus on (e.g., TUI work lives under `crates/rsi`, daemon work under `crates/rsid`, shared types live in `crates/rsi-common`)
   - Trace data flow and key functions
   - Return detailed explanations with file:line references

3. **Read all files identified by research tasks**:
   - After research tasks complete, read ALL files they identified as relevant
   - Read them FULLY into the main context
   - This ensures you have complete understanding before proceeding

4. **Analyze and verify understanding**:
   - Cross-reference the ticket requirements with actual code
   - Identify any discrepancies or misunderstandings
   - Note assumptions that need verification
   - Determine true scope based on codebase reality

5. **Make autonomous decisions based on research**:
   - Use your codebase research to resolve all technical questions yourself
   - Make design decisions based on existing patterns and the Five-Expert Framework
   - If something is truly ambiguous, choose the option that best fits existing conventions
   - Do NOT pause to ask the user questions — proceed directly to the next step
   - Document any significant decisions and their rationale in the plan itself

### Step 2: Research & Discovery

Proceed directly from Step 1 without waiting for user input:

1. **Create a research todo list** using TodoWrite to track exploration tasks

2. **Spawn parallel sub-tasks for comprehensive research**:
   - Create multiple Task agents to research different aspects concurrently
   - Use the right agent for each type of research:

   **For deeper investigation:**
   - **codebase-locator** - To find more specific files (e.g., "find all files that handle [specific component]")
   - **codebase-analyzer** - To understand implementation details (e.g., "analyze how [system] works")
   - **codebase-pattern-finder** - To find similar features we can model after

   **For historical context:**
   - **thoughts-locator** - To find any research, plans, or decisions about this area
   - **thoughts-analyzer** - To extract key insights from the most relevant documents

   **For related tickets:**
   - **linear-searcher** - To find similar issues or past implementations

   Each agent knows how to:
   - Find the right files and code patterns
   - Identify conventions and patterns to follow
   - Look for integration points and dependencies
   - Return specific file:line references
   - Find tests and examples

3. **Wait for ALL sub-tasks to complete** before proceeding

4. **Select the best approach autonomously**:
   - Evaluate design options against the Five-Expert Framework
   - Choose the approach that best fits existing codebase patterns and conventions
   - Document the decision and reasoning in the plan itself (under a "Design Decisions" section)
   - Do NOT pause to ask the user — proceed directly to Step 3

### Step 3: Plan Structure Development

Proceed directly from Step 2 without waiting for user input:

1. **Design the plan structure autonomously** based on research findings
   - Determine the right number of phases based on complexity
   - Order phases so each builds on the previous (Tech Wizard veto applies)
   - **Cross-stage linkage (MWP/ICM — binding):** every phase/item that traces
     to research declares `satisfies: [F-…]` naming the research `Finding.id`(s)
     it closes (see the phase template). This is the provenance anchor
     `validate_plan` and the cross-stage VERIFY pass (`cross_stage_verify_coverage`)
     check: an item that closes a finding but declares no `satisfies:` is
     research→plan→impl drift and fails validation. Pure-scaffolding items with
     no research antecedent MAY omit it — note the omission so it reads as
     intentional, not a gap.
   - **Evidence-tier audit (binding):** tag every load-bearing plan claim with
     the shared `[observed]`, `[source]`, or `[inferred]` vocabulary and cite
     the primary artifact/result. Mechanically extract machine-readable facts
     and prove the current tool surface can express an exact proposed shape.
     `[inferred]` is forbidden in Acceptance Criteria and Success Criteria. A
     plan with any load-bearing `[inferred]` claim must execute and reclassify
     the claim or downgrade readiness; it cannot be labeled `decision-complete`
     or `implementation-ready`, described as `ready for implementation`, or
     given any equivalent readiness promise.
   - Proceed directly to writing the detailed plan

### Step 4: Detailed Plan Writing

Proceed directly from Step 3:

1. **Write the plan** to `thoughts/shared/plans/YYYY-MM-DD-ENG-XXXX-description.md`
   - Format: `YYYY-MM-DD-ENG-XXXX-description.md` where:
     - YYYY-MM-DD is today's date
     - ENG-XXXX is the ticket number (omit if no ticket)
     - description is a brief kebab-case description
   - Examples:
     - With ticket: `2025-01-08-ENG-1478-parent-child-tracking.md`
     - Without ticket: `2025-01-08-improve-error-handling.md`
2. **Use this template structure**:

````markdown
# [Feature/Task Name] Implementation Plan

## Overview

[Brief description of what we're implementing and why]

