description = "Trace current rsi behavior and record checked source evidence"
prompt = '''---
description: Trace current rsi behavior and record checked source evidence
model: opus
capability_class: architect
---

# Research Codebase

Map the current implementation for the question given. Use source and tests as
the primary evidence; use prior notes to explain history. Describe behavior,
ownership, and connections. Offer diagnoses or proposed changes only when the
request calls for them.

**Worker preamble (binding):** This command and any sub-agents it spawns MUST load and obey `.claude/commands/_shared/worker_preamble.md` with `role=research` before acting. That file defines the read budget, return budget, forbidden-content rules, and failure-mode contract. The rules below COMPOSE ON TOP and may tighten (never loosen) any limit declared there.

## Five-Expert Research Lenses

This application is built for a single user (IQ 150, ADHD, vim devotee). Quality over speed. When researching, evaluate what exists through all five expert lenses:

1. **SWE** (Clean architecture): Document the abstraction boundaries. Where are responsibilities divided? Any duplicate code or unclear ownership?
2. **Tech Wizard** (Zero-waste correctness): Is the current foundation correct for what needs to be built? What would become throwaway if we build on this as-is?
3. **UI/UX Power User** (Information density): Does the current interface serve a power user who reads fast and thinks fast? Where is density lacking? Are actions keyboard-efficient?
4. **Cognitive Flow Engineer** (ADHD-aware design): Where are the latency risks? What could fracture flow state? Are notifications ambient or interruptive? Where are test coverage gaps that would force debugging by feel?
5. **Vim Language Designer** (Compositional grammar): Does the current keybinding model compose with vim's verb-noun grammar? Are there bindings that violate vim conventions?

These lenses inform WHAT to document. Describe the state relative to each lens without recommending changes unless the user explicitly asks. The experts shape your observation, not your judgment.

Canonical reference with full expert descriptions: `five-experts.md`

## Start

If the question names a file, ticket, or document, read its relevant sections
first. If no question was supplied, ask for the area to investigate and wait.
Keep the shared preamble's read and return budgets throughout the task.

## Scope Routing — MANDATORY

After receiving the user's research query (and before spawning sub-agents in Step 3), assess scope. If ANY of the following are true, automatically route to `/team_research`:

- Spans >2 crates or major subsystems (e.g., TUI + daemon + common simultaneously)
- Likely needs >5 research sub-agents to cover
- Crosses >3 independent domains (e.g., schema + RPC + UI + persistence)
- Estimated >30 min of focused investigation

Announce the routing decision once:
```
Scope is team-sized (reason: <1 sentence>); routing to `/team_research`.
```

Continue immediately in the current invocation using the Team Research workflow
in `team_research.md`. Do not ask for confirmation and do not require the user
to re-invoke another command. If the active harness cannot dispatch team
workers, apply the same domain decomposition and synthesis discipline in the
current session and note the degraded execution mode; do not turn missing team
tooling into a user gate. An explicit user instruction to keep the work solo
overrides this automatic route.

## Workflow

1. **Read the inputs.** Record the question and inspect named files before
   delegating. Keep reads within the shared preamble's budget.
2. **Divide the investigation.** Locate entry points with `rg` or
   `rg --files`, follow the relevant calls and data, and assign distinct
   research areas. Inspect tests for observable behavior.
3. **Trace each area.** If the active harness supports research sub-agents and
   the scope justifies them, give each a separate domain and a compact evidence
   request. Built-in `Explore` and `codebase-analyzer` are suitable where
   available. Check their claims in the main context. Read relevant
   `thoughts/` files and recent commits after the live paths are known; use
   them as history, not proof of today's behavior.
4. **Synthesize.** Recheck file and line references, explain how components
   interact, and separate observed behavior from unresolved questions. Do not
   turn a research report into an unsolicited implementation plan.
5. **Gather document metadata.** Capture the current date with timezone, HEAD,
   branch, repository name, researcher, and the exact question before writing.
   Name the file `thoughts/shared/research/YYYY-MM-DD-ENG-XXXX-topic.md`
   when a ticket number exists; omit the ticket component otherwise.
6. **Write the research document.** Include YAML frontmatter with `date`,
   `researcher`, `git_commit`, `branch`, `repository`, `topic`,
   `tags`, `status`, `last_updated`, and `last_updated_by`. Use these
   headings and give every finding a concrete source reference:

   ```markdown
   # Research: [topic]

   ## Research Question
   ## Summary
   ## Detailed Findings
   ### [Component/Area 1]
   ### [Component/Area 2]
   ## Code References
   ## Architecture Documentation
   ## Historical Notes
   ## Related Research
   ## Open Questions
   ```

   The summary answers the question. Detailed Findings describe the current
   paths and behavior. Code References list checked `path:line` locations.
   Open Questions record facts that could not be established.

6b. **Emit JSON companion + validate (RSI-014, optional):**
   The markdown research document is always the authoritative source. Consumer skills (`/plan`, `/team_plan`) read markdown when no JSON exists or when the markdown declares `json_companion_status: invalid`.

   Generate a typed JSON sidecar ONLY when:
   - The user explicitly requests typed output (e.g., "with typed findings"),
   - OR a downstream consumer explicitly requests the research with `typed: true`,
   - OR you choose to provide it for a complex research that will directly feed planning via `satisfies:` linkage.

   When JSON is generated, follow this flow. Never search or build from an absolute RSI checkout and never assume a `crates/` layout.

   1. **Probe for validator:** Check if `target/debug/rsi-research-validate` is executable.
   2. **Build if needed/wanted:** If the validator is absent and you choose to generate JSON (per the conditions above), run `cargo metadata --no-deps --format-version 1`; if successful metadata contains package `rsi-common` with exact binary target `rsi-research-validate`, run `cargo build -p rsi-common --bin rsi-research-validate --quiet`, select `target/debug/rsi-research-validate`. A build failure does not block JSON generation (JSON is best-effort when unsolicited); validate later or report the build failure and use markdown fallback.
   3. **PATH fallback:** If a validator is not found locally, skip JSON generation; markdown is authoritative.
   4. Construct the JSON object from your in-memory working set:
      - `version`: `2` (the constant `RESEARCH_SCHEMA_VERSION`; v2 is a strict superset of v1).
      - `research_question`: the original user query verbatim.
      - `areas`: the list of `### [Component/Area X]` heading names you wrote under `## Detailed Findings`. Must be non-empty.
      - `findings`: for each subsection bullet, emit `{ id: <"F-001", "F-002", …>, summary: <≤25 words>, file_ref: <"path:line" or "path:start-end">, confidence: "medium" }`. **Mint `id` as a stable, monotonic join key** (`F-001`, `F-002`, …) — this is the provenance anchor `/plan` items reference via `satisfies:` and the cross-stage VERIFY pass checks. Assign each finding its own id; never reuse or renumber across a revision.
      - `file_refs`: for each entry under `## Code References`, emit `{ path, lines: [start, end] }` (encode `path:N` as `lines: [N, N]`).
      - `open_questions`: for each entry under `## Open Questions`, emit `{ summary: <≤25 words>, blocks_planning: false }` unless the question explicitly names a missing prerequisite (then `true`).
   5. Write the JSON to `<doc>.json` (sibling of the markdown).
   6. If a validator is available, run `rsi-research-validate <doc>.json --strict`.
   7. On validator exit `0` → proceed to step 7 (GitHub permalinks). Both files commit together.
   8. On validator exit `2` or `1` → delete `<doc>.json` (`rm`); insert `json_companion_status: invalid` into the markdown frontmatter (before the closing `---`); proceed to step 7. The markdown remains committed; consumer skills detect the frontmatter flag and skip the JSON probe.

   The JSON is opaque to daemon pipeline detection (`PIPELINE_PATH_RE` only matches `.md`); no auto-derive double-fire concern.

7. **Add GitHub permalinks (if applicable):** Only use a permalink when
   the cited commit is available on the remote. Otherwise keep local path and
   line references. Do not substitute a moving branch URL for a commit URL.
8. **Commit and report.** Commit the markdown and a valid JSON companion
   together. Summarize the findings, references, and unresolved questions.
9. **Follow-up research.** Append dated findings to the same document, update
   `last_updated` and `last_updated_by`. If a JSON companion exists, revalidate
   it; otherwise, update only markdown and commit. Recheck live code for each new question.

## Stage contract

### Inputs

Named question and files, or a bounded code-discovery budget using `rg` and
`rg --files`. The shared preamble supplies the read budget.

### Process

Trace current code and tests, inspect relevant history, verify references,
and write the markdown. Generate JSON companion (step 6b) only when explicitly
requested or when consuming planning will directly use `satisfies:` linkage.

### Outputs

A committed research markdown file with YAML frontmatter. When JSON is generated,
a v2 JSON sidecar with stable `F-001` style finding IDs (sibling `.json` file).
The markdown is always the authoritative source.

### Verify

Check that every cited path and line exists in the current checkout. If JSON
was generated, validate it with `rsi-research-validate` when the validator is
available. Markdown remains authoritative even if validation fails or if JSON
is absent.

- **COMMIT AND PUSH — REQUIRED**: Before responding, commit the research document and other task-owned files using explicit paths. Never stage the entire `thoughts/` directory or unrelated edits. Leave the tree clean. Push only if the user explicitly asked; then push the current feature branch as a safe fast-forward, never `main`.
- Preserve the exact directory of every `thoughts/` source you cite;
  do not rewrite a personal note path into `thoughts/shared/`.
- When updating a document, keep frontmatter field names in snake_case and
  record the update date. Never leave placeholder metadata in a committed file.
- Always write the research document to `thoughts/shared/research/` — the daemon detects this Write and automatically derives the next pipeline step (`/plan`).
'''
