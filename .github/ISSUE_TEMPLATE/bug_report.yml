name: Bug report
description: Something in rsi or rsid is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `rsi`
        2. Press ...
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or `git rev-parse --short HEAD` if built from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Other]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider(s) involved
      placeholder: Claude, Codex, Local, ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/.rsi/daemon.log`. Remove API keys and anything private first.
      render: text
